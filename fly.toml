# Fly.io-konfig for den HOSTEDE Wenche-tjenesten (operatørselskapets drift).
# Deploy: `flyctl deploy` lokalt, eller automatisk via .github/workflows/deploy-hosted.yml.
# Hemmeligheter settes med `flyctl secrets set ...`, ALDRI her (denne fila er åpen kildekode).

app = "wenche-hosted"          # bytt til ditt faktiske Fly-appnavn (settes av `flyctl launch`)
primary_region = "ams"         # Amsterdam, EØS. Flyttet fra "arn" (Stockholm) 2026-06-08 da arn manglet vert-kapasitet.

[build]
  dockerfile = "Dockerfile"

[env]
  # PROD: invite-only prod-drift. Krever prod-vendor-secrets satt (ellers fail-closer appen).
  # Flip til "test" igjen for å peke mot tt02.
  WENCHE_ENV = "prod"
  # App-URL brukt i invite-lenkene.
  HOSTED_PUBLIC_URL = "https://app.wenche.cloud"

[http_service]
  internal_port = 8080
  force_https = true
  # SCALE-TO-ZERO for minimal kostnad (invite-only): maskinen dvaler når ingen bruker den
  # og våkner automatisk på første request. "suspend" fryser VM-en med RAM intakt i stedet
  # for å boote på nytt, så vekking er sub-sekund (ikke ~2 s kaldstart) og en bruker som
  # tar seg tid til å fylle ut ikke merker pausen. Kostnadsprofilen er ~lik "stop" (ingen
  # CPU/RAM-kost mens suspendert). Fly kan i sjeldne tilfeller falle tilbake til "stop";
  # det er trygt (session-tilstand ligger i signert cookie, ingen kundedata i serverminnet).
  # Ikke skaler til flere maskiner (da ville sesjoner spres mellom dem).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/api/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"          # billigste nivå (~2 USD/mnd). Bump til "512mb" KUN hvis
                            # du ser OOM-/restart i Fly-dashbordet under faktisk bruk.
