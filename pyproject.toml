[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wenche"
version = "1.16.1"
description = "Enkel innsending av årsregnskap, skattemelding og aksjonærregisteroppgave til Altinn for små selskaper uten ordinær drift"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["altinn", "skatt", "regnskap", "aksjonaerregister", "skattemelding", "holdingselskap", "norge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Norwegian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "authlib>=1.3",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Utvikling: tester, lint, typesjekk, dokumentasjon. lxml trengs for XSD-validering av generert
# XML i testsuiten (tests/test_xsd_validering.py hopper stille over uten den).
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "lxml>=5.0",
    "ruff>=0.17",
    "mypy>=1.14",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
    "mkdocs-material>=9.5",
    # Validerer config.example.yaml og testconfiger mot JSON Schema-et `wenche skjema` lager.
    "jsonschema>=4.23",
]
# Den hostede tjenesten (hosted/): signerte sesjonscookies. Resten (FastAPI, uvicorn) er alt
# kjerneavhengigheter fordi `wenche` starter det lokale webgrensesnittet.
hosted = ["itsdangerous>=2.0"]

[project.urls]
Homepage = "https://github.com/olefredrik/wenche"
Repository = "https://github.com/olefredrik/wenche"
Issues = "https://github.com/olefredrik/wenche/issues"

[project.scripts]
wenche = "wenche.cli:main"

# Den bygde SPA-en (wenche/web/static) er git-ignorert (bygges ved release).
# `artifacts` ligger på topp-nivå så den gjelder BÅDE sdist og wheel. Det er kritisk:
# `python -m build` (uten flagg) bygger sdist først og bygger så wheelen FRA sdist-en, så
# hvis static bare var deklarert under wheel-target ville den falle ut av sdist-en og dermed
# mangle i wheel-bygget-fra-sdist (issue #121). `artifacts` (i motsetning til force-include)
# feiler heller ikke når mappen mangler (editable-install, bidragsytere uten bygd frontend).
[tool.hatch.build]
artifacts = ["wenche/web/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["wenche"]
# Frontend-kilden (TS/Vite) hører ikke hjemme i wheelen, kun den bygde SPA-en serveres.
exclude = ["wenche/web/frontend"]

[tool.pytest.ini_options]
# Gjør at `pytest` finner suiten uansett hvor i repoet den kjøres fra.
testpaths = ["tests"]

[tool.coverage.run]
source = ["wenche", "hosted"]
omit = ["hosted/web/*", "wenche/web/frontend/*", "wenche/web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade (f.eks. `X | None` i stedet for Optional)
    "B",       # bugbear
    "S",       # bandit (sikkerhet)
]
ignore = [
    # Linjelengde håndteres av formatereren. Lange kommentarer og strenger får stå.
    "E501",
    # xml.etree brukes til å BYGGE XML og til å lese svar via defusedxml (saft.py,
    # skd_skattemelding_client.py, skattemelding_xml.py, fristsjekk.py), ikke til å parse
    # upålitelig XML med stdlib-parseren.
    "S314",
]

[tool.ruff.lint.per-file-ignores]
# Tester bruker assert og oppdiktede hemmeligheter med vilje.
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-idiomet `config: dict = Body(...)` er ikke et foranderlig standardargument.
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["wenche", "hosted"]

[tool.mypy]
python_version = "3.11"
files = ["wenche", "hosted"]
# `hosted/` er en navnerompakke (ingen __init__.py); uten dette fant mypy hosted/api/auth.py både
# som `api.auth` og `hosted.api.auth` når et skript importerer `hosted.api.auth`.
explicit_package_bases = true
# Sjekk også funksjoner uten typehint, så feil i dem ikke går under radaren.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Tredjepartspakker uten typeinformasjon (authlib, dotenv, defusedxml) behandles som Any.
ignore_missing_imports = true
