# Wenche — konfigurasjonsfil
# Kopier denne til config.yaml og fyll inn dine egne verdier.
# config.yaml skal IKKE legges i git (se .gitignore).
#
# Bruker du webgrensesnittet (wenche ui) trenger du ikke redigere denne filen
# manuelt — all informasjon kan fylles inn direkte i nettleseren.

selskap:
  navn: "Eksempel Holding AS"
  org_nummer: "123456789"           # 9 siffer uten mellomrom
  daglig_leder: ""                  # Navn på daglig leder
  styreleder: ""                    # Kan være samme person som daglig leder
  forretningsadresse: "Eksempelgata 1, 0001 Oslo"
  stiftelsesaar: 2022
  # stiftelsesdato: 2018-03-14        # Valgfri, eksakt dato (ÅÅÅÅ-MM-DD). Hentes fra
                                      # Enhetsregisteret. Brukes i aksjonærregisteroppgaven
  aksjekapital: 30000               # NOK — fra stiftelsesdokumentene
  kontakt_epost: ""                 # Påkrevd for aksjonærregisteroppgave (RF-1086)

regnskapsaar: 2025                  # Året regnskapet gjelder for

# --- Resultatregnskap ---
# Alle beløp i hele kroner (NOK). Bruk 0 for poster som ikke er aktuelle.

resultatregnskap:
  driftsinntekter:
    salgsinntekter: 0               # Inntekter fra salg av varer eller tjenester
    andre_driftsinntekter: 0        # Andre løpende driftsinntekter

  driftskostnader:
    loennskostnader: 0              # Lønn, arbeidsgiveravgift og lignende
    avskrivninger: 0                # Planmessige avskrivninger på anleggsmidler
    andre_driftskostnader: 0        # Bank- og regnskapsgebyrer, kontorkostnader o.l.

  finansposter:
    utbytte_fra_datterselskap: 0      # Utbytte mottatt fra datterselskaper (fritaksmetoden)
    andre_finansinntekter: 0          # Renteinntekter og andre finansinntekter
    rentekostnader: 0                 # Renter på lån
    andre_finanskostnader: 0          # Andre finanskostnader

  # Skattekostnad på ordinært resultat (rskl. § 6-1). Egen linje før årsresultatet.
  # 0 for et selskap uten skattepliktig inntekt; har selskapet f.eks. renteinntekt,
  # føres skatten her (og som betalbar_skatt i balansen hvis den ikke er betalt).
  skattekostnad: 0

# --- Regnskapsperiode (valgfritt) ---
# Normalt hele kalenderåret, og da skal begge stå urørt.
# Oppgi dem bare ved forlenget første regnskapsår (rskl. § 1-7 andre ledd): et selskap
# stiftet sent på året kan la det første regnskapsåret løpe i inntil 18 måneder, fram til
# 31.12 året etter. Da skal regnskapsaar over være året perioden AVSLUTTES.
#
# regnskapsstart: 2025-11-20      # Stiftelsesdatoen
# regnskapsslutt: 2026-12-31      # Alltid 31. desember

# --- Balanse ---
# Balansen skal gå opp: sum eiendeler = sum egenkapital og gjeld.
# Stemmer ikke tallene, vil Wenche gi en advarsel.

balanse:
  eiendeler:
    anleggsmidler:
      aksjer_i_datterselskap: 0       # Kostpris for aksjer i heleide datterselskaper
      andre_aksjer: 0                 # Aksjer i selskaper der du eier under 90 %
      langsiktige_fordringer: 0       # Lån gitt til andre med løpetid over 1 år
    omloepmidler:
      kortsiktige_fordringer: 0       # Kundefordringer og andre kortsiktige krav
      bankinnskudd: 0                 # Saldo på driftskonto per 31.12

  egenkapital_og_gjeld:
    egenkapital:
      aksjekapital: 30000             # Innbetalt aksjekapital (fra stiftelsesdokumentene)
      overkursfond: 0                 # Innbetalt over pålydende ved emisjon
      annen_egenkapital: 0            # Akkumulert overskudd/underskudd. Negativ = underskudd
    langsiktig_gjeld:
      laan_fra_aksjonaer: 0           # Lån fra eier med avtalt løpetid over 1 år
      andre_langsiktige_laan: 0       # Banklån og andre lån med løpetid over 1 år
    kortsiktig_gjeld:
      leverandoergjeld: 0             # Ubetalte fakturaer per 31.12
      betalbar_skatt: 0               # Skyldig selskapsskatt per 31.12 (konto 2500),
                                      # motposten til skattekostnaden i resultatregnskapet
      skyldige_offentlige_avgifter: 0 # Skyldig mva, arbeidsgiveravgift o.l.
      avsatt_utbytte: 0               # Utbytte styret har foreslått for regnskapsåret
                                      # (konto 2800). Reduserer egenkapitalen i år, ikke i
                                      # året utbetalingen skjer. La stå 0 hvis utbyttet er
                                      # vedtatt og utbetalt i året uten forutgående avsetning
      annen_kortsiktig_gjeld: 0       # Annen gjeld med forfall innen 1 år

# --- Foregående år (sammenligningstall) ---
# Obligatorisk etter regnskapslovens § 6-6.
# Kopier inn tilsvarende tall fra fjorårets regnskap.
# Dersom selskapet ble stiftet i inneværende år, kan seksjonen utelates.

foregaaende_aar:
  resultatregnskap:
    driftsinntekter:
      salgsinntekter: 0
      andre_driftsinntekter: 0
    driftskostnader:
      loennskostnader: 0
      avskrivninger: 0
      andre_driftskostnader: 0
    finansposter:
      utbytte_fra_datterselskap: 0
      andre_finansinntekter: 0
      rentekostnader: 0
      andre_finanskostnader: 0
    skattekostnad: 0
  balanse:
    eiendeler:
      anleggsmidler:
        aksjer_i_datterselskap: 0
        andre_aksjer: 0
        langsiktige_fordringer: 0
      omloepmidler:
        kortsiktige_fordringer: 0
        bankinnskudd: 0
    egenkapital_og_gjeld:
      egenkapital:
        aksjekapital: 0
        overkursfond: 0
        annen_egenkapital: 0
      langsiktig_gjeld:
        laan_fra_aksjonaer: 0
        andre_langsiktige_laan: 0
      kortsiktig_gjeld:
        leverandoergjeld: 0
        betalbar_skatt: 0
        skyldige_offentlige_avgifter: 0
        avsatt_utbytte: 0
        annen_kortsiktig_gjeld: 0

# --- Skattemelding ---

skattemelding:
  underskudd_til_fremfoering: 0     # Fremførbart underskudd fra tidligere år (NOK).
                                    # Finnes i fjorårets skattemelding (RF-1028).
  anvend_fritaksmetoden: false      # true for holdingselskaper som eier aksjer i
                                    # datterselskaper (skatteloven § 2-38).
  # eierandel_for_fritaksmetoden: 100  # Eierandel i selskapet som deler ut utbytte
                                    # (prosent, 0–100). Brukes bare når
                                    # anvend_fritaksmetoden er true.
                                    # ≥ 90 %: hele utbyttet er skattefritt.
                                    # < 90 %: 3 % er skattepliktig (sjablonregelen).
  boersnotert: false                # true hvis selskapet er børsnotert.
  formuesverdi_aksjer: 0            # Formuesverdi av aksjer selskapet eier, fra
                                    # aksjeoppgaven RF-1088S (post 209). Brukes til å
                                    # beregne netto formuesverdi bak selskapets aksjer.
  # samlet_verdi_bak_aksjene: 0     # Valgfri: overstyr beregnet netto formuesverdi
                                    # bak aksjene direkte (ellers beregnes den fra
                                    # formuesverdi_aksjer + balanse).

# Valgfritt for regnskapssystemer som må bevare de eksakte offisielle kodene i
# næringsspesifikasjonen. Utelat seksjonen ved manuell bruk. Oppgis listen, må den være
# komplett og summere nøyaktig til resultat- og balansetallene over.
# naeringsspesifikasjon:
#   poster:
#     - kategori: annenDriftskostnad
#       kode: "6350"
#       beloep: 1000
#     - kategori: kortsiktigGjeld
#       kode: "2740"
#       beloep: 250

# --- Aksjonærregister ---
# List opp alle aksjonærer per 31.12 i regnskapsåret.
# Fødselsnummer brukes av Skatteetaten til å forhåndsutfylle aksjonærenes skattemelding.

aksjonaerer:
  - navn: "Kari Nordmann"
    fodselsnummer: "01010112345"        # 11 siffer — personnummer
    antall_aksjer: 1000
    aksjeklasse: "ordinære"
    utbytte_utbetalt: 0                 # Utbytte utbetalt til denne aksjonæren i NOK
    innbetalt_kapital_per_aksje: 30     # Aksjekapital (NOK) / antall aksjer.
                                        # Eks: 30 000 kr / 1 000 aksjer = 30 kr per aksje
