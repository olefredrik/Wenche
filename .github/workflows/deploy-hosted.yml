# Deployer den hostede Wenche-tjenesten til Fly.io.
#
# MANUELL utløsing (workflow_dispatch) med vilje, så merge til main IKKE auto-deployer.
# Vi deployer foreløpig manuelt med `flyctl deploy --remote-only` lokalt. Vil du senere ha
# auto-deploy ved merge til main, legg tilbake en `push:`-trigger + sett FLY_API_TOKEN.
#
# Sikkerhet (åpen kildekode): kjører aldri fra fork-PR-er, og GitHub eksponerer ikke secrets
# til fork-workflows. FLY_API_TOKEN bor i GitHub-secret, aldri i repoet.
#
# Forutsetninger for å bruke denne (Settings → Actions, kjør manuelt):
#   1. Fly-appen finnes (`flyctl launch`/`apps create`), app-navnet matcher fly.toml.
#   2. Secrets satt med `flyctl secrets set ...` (session/invite/vendor).
#   3. GitHub: repo-secret FLY_API_TOKEN + et "production"-environment.

name: Deploy hosted

on:
  workflow_dispatch: {}

# cancel-in-progress er av: en deploy som avbrytes halvveis er verre enn to i kø.
concurrency:
  group: deploy-hosted
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
