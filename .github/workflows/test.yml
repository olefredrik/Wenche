name: Tester

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "bump/**"
      - "docs/**"
      - "refactor/**"
      - "chore/**"
      - "security/**"
      - "test/**"
      - "ci/**"
      - "build/**"
      - "style/**"
      - "perf/**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint og typesjekk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Installer avhengigheter
        run: pip install -e ".[dev,hosted]"
      - name: ruff (lint og formatering)
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Tester (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Installer avhengigheter
        run: pip install -e ".[dev,hosted]"
      - name: Kjør tester med dekning
        run: pytest --cov --cov-report=term-missing:skip-covered

  avhengigheter:
    name: Kjente sårbarheter (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Installer avhengigheter
        run: pip install -e ".[dev,hosted]"
      # Synliggjør kjente CVE-er i avhengighetene uten å blokkere urelaterte PR-er.
      # Strammes til blokkerende når den har vist seg stabil.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit --skip-editable

  frontend:
    name: Frontend (typesjekk, lint, bygg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typesjekk (tsc) for alle tre workspaces
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Bygg begge SPA-ene
        run: |
          npm run build --workspace hosted/web
          npm run build --workspace wenche/web/frontend
      # Som pip-audit: synliggjør, blokkerer ikke ennå.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high
