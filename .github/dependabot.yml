# Dependabot holder avhengigheter og actions oppdatert. Mindre oppdateringer (minor/patch)
# samles i én PR per økosystem per uke, så ikke hver lille bump blir en egen PR. Major-bumper
# kommer hver for seg, siden de kan kreve endringer.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-mindre:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Pakker som må bumpes sammen: react-dom krever samme major som react (ellers ERESOLVE),
      # og @vitejs/plugin-react krever bestemt vite-major. Første gruppe som passer, vinner.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*", "@tailwindcss/vite"]
      npm-mindre:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
