# Dependabot: bare det som gir verdi for et lite soloprosjekt.
#
# Versjonsoppdateringer (rutinebumper) er av for pip, npm og docker. De ga en PR-strøm som ikke
# sto i forhold til nytten, og CI melder alt kjente sårbarheter (pip-audit og npm audit).
# Sikkerhetsoppdateringer styres av repo-innstillingen (ikke denne fila) og fortsetter som før:
# Dependabot åpner en PR når en avhengighet får en kjent sårbarhet, også for låsen i
# hosted/requirements.txt. Større oppgraderinger (React 19, TypeScript 7, nye majorer) tas bevisst
# og med test når de trengs, ikke som rutine.
#
# Actions er med, månedlig og samlet i én PR: de er pinnet til commit-SHA, og uten bumper ville
# pinningene aldri flyttet seg.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
